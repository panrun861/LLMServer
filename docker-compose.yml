services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PLLM_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 系统资源监控挂载（只读）：主机 /proc、根文件系统、Docker socket
    volumes:
      - /proc:/host/proc:ro
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # 授权 GPU 设备，使容器内可运行 nvidia-smi 采集 GPU 指标
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/aitube_pllm/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  postgres_data: